<article class="event-card">

  <div class="row  event-card__row">

    <div class="event-card__img-col">
      <a href="#" class="embed-responsive  event-card__img" tabindex="-1" aria-hidden="true">
        <picture>
          <!-- 540x304, 810x456 от 1440 -->
          <!-- 440x248, 660x370 от 1280 -->
          <!-- 1340x754 от 1024 -->
          <!-- 960x540 от 768 -->
          <!-- 640x360 от 480 -->
          <!-- 540x304 от 300 -->
          <source srcset="img/@@img.webp" type="image/webp">
          <img src="img/@@img.jpg" alt="@@title" width="640" height="360" loading="lazy">
        </picture>
      </a>
    </div>

    <div class="event-card__text-col">
      <div class="event-card__text-wrapper">
        <div class="event-card__top">
          <span class="badge  badge--icon">
            <svg width="18" height="18" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#@@icon-18"></use></svg>
            @@kind
          </span>
          <span class="badge">@@type</span>
        </div>
        <h3 class="h4  event-card__title">
          <a href="#">@@title</a>
        </h3>
        <div class="event-card__descr">@@text</div>
      </div>

      <div class="event-card__footer">

        <p class="event-card__speakers">
          <span>Спікери:</span>
          @@speakers
        </p>

        <div class="event-card__bottom">

          <div class="event-card__date-wrapper">
            <span class="date-time  date-time--date">
              <svg width="20" height="20" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#calendar-20"></use></svg>
              <time datetime="2026-01-21T10:00+03:00">21 січня 2026</time>
            </span>
            <span class="date-time  date-time--time">
              <svg width="20" height="20" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#time-20"></use></svg>
              <span>10:00 - 12:30 (GMT+3)</span>
            </span>
            <span class="date-time  date-time--location">
              <svg width="20" height="20" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#location-20"></use></svg>
              <span>@@location</span>
            </span>
          </div>

          @@include('../../blocks/faux-link/faux-link.html')

        </div>

      </div>

    </div>

  </div>

</article>
