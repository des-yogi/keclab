<article class="data-model-card">
  <div class="row  data-model-card__row">

    <div class="data-model-card__img-col">
      <a href="#" class="embed-responsive  data-model-card__img" tabindex="-1" aria-label="@@title">
        <picture>
          <!-- 630x354, 960x540 2x от 1440 -->
          <!-- 440x248, 660x370 2x от 1280 -->
          <!-- 1340x754 от 1024 -->
          <!-- 960x540 от 768 -->
          <!-- 616x370 от 480 -->
          <!-- 540x304 от 300 -->
          <source srcset="img/@@img.webp" type="image/webp">
          <img src="img/@@img.jpg" alt="Alt text" width="640" height="360" loading="lazy">
        </picture>
      </a>
    </div>

    <div class="data-model-card__text-col">
      <div class="data-model-card__text-wrapper">
        <div class="data-model-card__top">
          <span class="badge  @@tagColor">@@tag</span>
        </div>
        <h3 class="data-model-card__title">
          <a href="#">@@title</a>
        </h3>
        <div class="data-model-card__text">
          @@text
        </div>
        <a href="#" class="btn-secondary" tabindex="-1" aria-hidden="true">
          <span class="btn-secondary__text">Детальніше</span>
          <span class="btn-secondary__icon">
            <svg width="24" height="24" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#chevron-right"></use></svg>
          </span>
        </a>
      </div>
    </div>

  </div>
</article>
